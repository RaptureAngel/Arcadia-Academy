[package]
name = "arcadia-desk"
version = "1.5.2"
description = "Arcadia Desk desktop shell"
authors = ["Arcadia Desk"]
edition = "2021"

[lib]
name = "arcadia_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
