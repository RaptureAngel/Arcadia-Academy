[package]
name = "arcadia-academy"
version = "0.1.0"
description = "Arcadia Academy desktop application"
authors = ["Arcadia Academy"]
edition = "2021"

[lib]
name = "arcadia_academy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
